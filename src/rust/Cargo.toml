[package]
name = 'smotifrs'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.65'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'smotifrs'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '0.9.0'
ahash = '0.8'
rayon = '1.10'
arrow = { version = '55', default-features = false, features = ['ipc'] }
parquet = { version = '55', default-features = false, features = ['arrow', 'snap', 'zstd', 'lz4'] }

[profile.release]
lto = true
codegen-units = 1
