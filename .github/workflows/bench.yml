# Re-runs data-raw/bench-rust-backend.R and commits the results the
# rust-backend vignette displays. Manual or on release only: the numbers
# change when the kernels do, not on every push.
on:
  workflow_dispatch:
    inputs:
      reps:
        description: Repetitions per case (median is recorded)
        required: false
        default: "3"
  release:
    types: [published]

name: Benchmark

permissions:
  contents: write

concurrency:
  group: bench

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      BENCH_REPS: ${{ inputs.reps || '3' }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: https://drieslab.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::FNN, smotif
          # The auto-detect resolves every Suggests (GiottoDisk is on no
          # repo the runner sees); nothing here renders documents.
          install-pandoc: false
          install-quarto: false

      - name: Install smotifrs from this commit
        run: R CMD INSTALL .

      - name: Run benchmark
        run: Rscript data-raw/bench-rust-backend.R

      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: vignettes/bench/

      # Results land on main whichever ref was benchmarked (a release tag
      # is a detached HEAD); dispatches from other branches only upload.
      - name: Commit results to main
        if: github.event_name == 'release' || github.ref == 'refs/heads/main'
        run: |
          cp -r vignettes/bench "$RUNNER_TEMP/bench"
          git fetch origin main
          git checkout -f -B main origin/main
          cp "$RUNNER_TEMP"/bench/* vignettes/bench/
          git add vignettes/bench
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update benchmark results for ${GITHUB_SHA::7}"
          git push origin main
